<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DevOps and Git Practical Assignment Page</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f6f8;
			margin: 0;
			padding: 40px;
			color: #333;
		}

		h1 {
			text-align: center;
			color: #2c3e50;
			margin-bottom: 20px;
		}

		p {
			max-width: 800px;
			margin: 0 auto 30px;
			line-height: 1.6;
			text-align: center;
			color: #555;
		}

		table {
			width: 80%;
			margin: 0 auto;
			border-collapse: collapse;
			background-color: white;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
		}

		th, td {
			border: 1px solid #ddd;
			padding: 12px;
			text-align: center;
		}

		th {
			background-color: #2c3e50;
			color: white;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		tr:hover {
			background-color: #e8f0fe;
		}
	</style>
</head>

<body>

	<h1>Welcome to Feature 1 - Cherry Pick</h1>

	<p>
		This page is created as part of the DevOps and Git practical assignment.
		It serves as a demonstration of basic HTML structure and content.
	</p>

	<table>
		<thead>
			<tr>
				<th>Column 1</th>
				<th>Column 2</th>
			</tr>
		</thead>

		<tbody>
			<tr>
				<td>Row 1, Cell 1</td>
				<td>Row 1, Cell 2</td>
			</tr>
			<tr>
				<td>Row 2, Cell 1</td>
				<td>Row 2, Cell 2</td>
			</tr>
		</tbody>
	</table>
	
	<p>This line was written for the merge conflict.</p>

</body>
</html>
